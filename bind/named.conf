options {
    directory "/var/cache/bind";
    listen-on port 5353 { any; };
    listen-on-v6 port 5353 { any; };
    // Rendered and validated at startup from DNS_UPSTREAMS.
    include "/var/cache/bind/recursion-options.conf";
    max-cache-size 64m;
    recursive-clients 128;
    allow-query { any; };
    allow-transfer { none; };
    allow-update { none; };
    notify no;
    minimal-responses no;
    version "not disclosed";
    hostname "dns-lab-authoritative";
    max-records-per-type 500;
    pid-file "/var/cache/bind/named.pid";
    session-keyfile "/var/cache/bind/session.key";
};

logging {
    channel stderr_log {
        stderr;
        severity info;
        print-time yes;
        print-severity yes;
        print-category yes;
    };
    category default { stderr_log; };
    category general { stderr_log; };
    category security { stderr_log; };
};

zone "example.test" {
    type primary;
    file "/etc/bind/zones/db.example.test";
};
zone "exact-match.test" {
    type primary;
    file "/etc/bind/zones/db.exact-match.test";
};
zone "ad.example.test" {
    type primary;
    file "/etc/bind/zones/db.ad.example.test";
};
zone "_msdcs.ad.example.test" {
    type primary;
    file "/etc/bind/zones/db._msdcs.ad.example.test";
};
zone "2.0.192.in-addr.arpa" {
    type primary;
    file "/etc/bind/zones/db.192.0.2";
};
zone "100.51.198.in-addr.arpa" {
    type primary;
    file "/etc/bind/zones/db.198.51.100";
};
zone "8.b.d.0.1.0.0.2.ip6.arpa" {
    type primary;
    file "/etc/bind/zones/db.2001.db8";
};
