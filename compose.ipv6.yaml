services:
  authoritative:
    ports:
      - target: 5353
        published: "${DNS_PORT:-5300}"
        host_ip: "::1"
        protocol: udp
      - target: 5353
        published: "${DNS_PORT:-5300}"
        host_ip: "::1"
        protocol: tcp

  fault-proxy:
    environment:
      LISTEN_HOST: "::"
      HEALTHCHECK_HOST: "::1"
    ports:
      - target: 5301
        published: "${DNS_FAULT_PORT:-53}"
        host_ip: "${DNS_BIND_IPV6:-::1}"
        protocol: udp
      - target: 5301
        published: "${DNS_FAULT_PORT:-53}"
        host_ip: "${DNS_BIND_IPV6:-::1}"
        protocol: tcp

networks:
  dns-lab:
    enable_ipv6: true
    ipam:
      config:
        - subnet: "${DNS_LAB_IPV6_SUBNET:-fd63:13::/64}"
