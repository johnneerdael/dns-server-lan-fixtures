name: dns-client-lab

services:
  authoritative:
    image: ghcr.io/johnneerdael/dns-lab-bind:0.5.0
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    environment:
      DNS_UPSTREAMS: "${DNS_UPSTREAMS:?Set DNS_UPSTREAMS in .env to your upstream resolver IPs}"
    tmpfs:
      - /var/cache/bind:rw,noexec,nosuid,size=16777216,mode=1777
    ports:
      - target: 5353
        published: "${DNS_PORT:-5300}"
        host_ip: "127.0.0.1"
        protocol: udp
      - target: 5353
        published: "${DNS_PORT:-5300}"
        host_ip: "127.0.0.1"
        protocol: tcp
    networks:
      dns-lab:
        aliases:
          - authoritative
    healthcheck:
      test: ["CMD-SHELL", "dig @127.0.0.1 -p 5353 example.test SOA +short | grep -q 2026092501"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s

  fault-proxy:
    image: ghcr.io/johnneerdael/dns-lab-fixtures:0.5.0
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 128m
    environment:
      DNS_ALLOWED_CLIENTS: "${DNS_ALLOWED_CLIENTS:-127.0.0.1/32,::1/128}"
      LISTEN_HOST: "0.0.0.0"
      LISTEN_PORT: "5301"
      UPSTREAM_HOST: authoritative
      UPSTREAM_PORT: "5353"
      HEALTHCHECK_HOST: "127.0.0.1"
      CHUNK_DELAY_MS: "${CHUNK_DELAY_MS:-50}"
      STALL_SECONDS: "${STALL_SECONDS:-2}"
      IO_TIMEOUT_SECONDS: "${IO_TIMEOUT_SECONDS:-5}"
      MAX_SESSIONS: "${MAX_SESSIONS:-64}"
    ports:
      - target: 5301
        published: "${DNS_FAULT_PORT:-53}"
        host_ip: "${DNS_FAULT_BIND_IPV4:-${DNS_BIND_IPV4:-127.0.0.1}}"
        protocol: udp
      - target: 5301
        published: "${DNS_FAULT_PORT:-53}"
        host_ip: "${DNS_FAULT_BIND_IPV4:-${DNS_BIND_IPV4:-127.0.0.1}}"
        protocol: tcp
    networks:
      dns-lab:
        aliases:
          - fault-proxy
    depends_on:
      authoritative:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "/app/dns_fault_proxy.py", "--healthcheck"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s

networks:
  dns-lab:
    driver: bridge
