name: Verify and publish DNS lab images

on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 -m pip install -r fault_proxy/requirements.txt
      - run: python3 -m unittest discover -s fault_proxy
      - run: python3 -m unittest discover -s bind/scripts
      - run: python3 -m unittest discover -s scripts
      - name: Verify built containers, DNSSEC recursion and access restrictions
        env:
          DNS_UPSTREAMS: 1.1.1.1
          CHECK_RECURSION: '1'
        run: bash scripts/verify-lab.sh

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - context: bind
            image: dns-lab-bind
          - context: fault_proxy
            image: dns-lab-fixtures
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          echo "tag=$version" >> "$GITHUB_OUTPUT"
      - name: Publish Linux amd64 and arm64 images
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/johnneerdael/${{ matrix.image }}:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/johnneerdael/dns-server-lan-fixtures
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.tag }}
      - name: Record published digest
        run: echo '${{ matrix.image }} @ ${{ steps.image.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
